}
function renderHluti(id,type){
  const h=HL[id];if(!h){renderHome();return;}
  view.h=h;view.type=type&&(h.types.includes(type)||type==='blandad')?type:h.types[0];
  const tabs=[...h.types,'blandad'];
  app.innerHTML=`<div style="--c:var(${h.c})"><button class="back" type="button" id="back">← Allir flokkar</button>
   <header class="hhead"><div class="sym">${h.sym}</div><div style="flex:1;min-width:200px"><div class="hc-num">${h.lota.num} · Hluti ${h.idx}</div><h2>${h.name}</h2></div><div id="hprog" style="flex:1;min-width:180px;max-width:300px">${progHTML(h)}</div></header>
   <nav class="tabs" aria-label="Tegundir dæma">${tabs.map(t=>`<button class="tab" type="button" data-t="${t}" aria-pressed="${t===view.type}">${t==='blandad'?ICON.dice.replace('<svg','<svg style="width:16px;height:16px;vertical-align:-2px"')+' ':''}${T[t].name}</button>`).join('')}</nav>
   <div class="tdesc" id="tdesc"></div><div class="ctx" id="ctx"></div><div class="plist" id="plist"></div>
   <div class="more"><button class="btn big b-new" type="button" id="newset">${ICON.dice} Ný dæmi</button></div></div>`;
  newSet();
}
function newSet(){
  const h=view.h,tp=T[view.type];
  document.getElementById('tdesc').textContent=tp.desc;
  view.ctx=tp.ctx?tp.ctx():null;
  document.getElementById('ctx').innerHTML=view.ctx?view.ctx.html:'';
  const cnt=tp.count||12;view.problems=[];
  for(let i=0;i<(tp.mixed?12:cnt);i++){let p;
    if(tp.mixed){const tk=pick(h.types),tt=T[tk];const c=tt.ctx?tt.ctx():null;p=tt.gen(c,R(0,3));p.tag=tt.name;if(c)p.pre=c.html;}
    else p=tp.gen(view.ctx,i);
    p.pid='p'+(pidN++);p.state={tries:0,scored:false,revealed:false};view.problems.push(p);}
  document.getElementById('plist').innerHTML=view.problems.map((p,i)=>cardHTML(p,i)).join('');
}
function fieldHTML(pid,f,i){
  if(f.type==='choice')return `<span class="choices" data-i="${i}" role="group">${f.opts.map((o,j)=>`<button type="button" class="choice" id="${pid}-c${i}-${j}" data-j="${j}">${o}</button>`).join('')}</span>`;
  return `<span class="fwrap"><input id="${pid}-f${i}" class="ans" data-i="${i}" style="--w:${f.w||3}" inputmode="numeric" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Svar">${f.neg?`<button type="button" class="neg" data-i="${i}" aria-label="Setja eða taka mínus">±</button>`:''}</span>`;
}
function cardHTML(p,idx){
  let body=p.html;if(!/\[\[/.test(body))body+='<div class="svar">Svar: [[0]]</div>';
  body=body.replace(/\[\[(m|\d+)(?::(\d+))?\]\]/g,(m,i,k)=>{
    if(i==='m')return `<input class="memo" id="${p.pid}-m${k}" inputmode="numeric" maxlength="2" autocomplete="off" aria-label="Minnisreitur">`;
    if(k!==undefined)return `<input class="ans dig" id="${p.pid}-f${i}-${k}" data-i="${i}" data-k="${k}" maxlength="1" inputmode="numeric" autocomplete="off" aria-label="Tölustafur">`;
    return fieldHTML(p.pid,p.fields[+i],+i);});
  return `<article class="pcard" id="${p.pid}" data-idx="${idx}">
    <div class="ptop"><span class="plabel">${'abcdefghijklmnop'[idx]}</span><div class="pq">${p.tag?`<span class="ptag">${p.tag}</span>`:''}${p.pre||''}${body}</div></div>
    <div class="pbtns"><button class="btn b-check" type="button">${ICON.check}Athuga svar</button><button class="btn b-help" type="button">${ICON.bulb}Útskýring</button><button class="btn b-show" type="button">${ICON.eye}Sýna svar</button></div>
    <div class="pmsg" aria-live="polite"></div><div class="pexp" hidden></div></article>`;
}

/* ================= interaction ================= */
const probOf=card=>view.problems.find(p=>p.pid===card.id);
function getVals(card,p){return p.fields.map((f,i)=>{
  if(f.type==='choice'){const b=card.querySelector(`.choices[data-i="${i}"] .choice.sel`);return b?Number(b.dataset.j):null;}
  if(f.type==='cols'){const ds=[...card.querySelectorAll(`input.dig[data-i="${i}"]`)].sort((a,b)=>a.dataset.k-b.dataset.k).map(x=>x.value.trim());const s=ds.join('');return s===''?null:parseNum(s);}
  const el=card.querySelector(`input.ans[data-i="${i}"]`);return el?parseNum(el.value):null;});}
const checkVals=(p,v)=>p.check?p.check(v):p.fields.map((f,i)=>v[i]===f.ans);
function fieldEls(card,i,f){if(f.type==='choice')return [...card.querySelectorAll(`.choices[data-i="${i}"] .choice.sel`)];return [...card.querySelectorAll(`input.ans[data-i="${i}"]`)];}
function clearMarks(card){card.querySelectorAll('.ok,.bad').forEach(e=>e.classList.remove('ok','bad'));}
function msg(card,cls,txt){const m=card.querySelector('.pmsg');m.className='pmsg '+cls;m.innerHTML=txt;}

function doCheck(card){
  const p=probOf(card);if(!p)return;const v=getVals(card,p);
  if(v.every(x=>x===null)){msg(card,'info','Skrifaðu svarið þitt í kassann fyrst.');return;}
  const ok=checkVals(p,v);clearMarks(card);
  p.fields.forEach((f,i)=>{const els=fieldEls(card,i,f);void card.offsetWidth;els.forEach(e=>e.classList.add(ok[i]?'ok':'bad'));});
  p.state.tries++;
  if(ok.every(Boolean)){
    let extra='';
    if(!p.state.revealed&&!p.state.scored){p.state.scored=true;const g=p.state.tries===1?2:1;S.stars+=g;S.done[view.h.id]=(S.done[view.h.id]||0)+1;save();updStars(true);extra=` +${g} ${g===1?'stjarna':'stjörnur'}`;const hp=document.getElementById('hprog');if(hp)hp.innerHTML=progHTML(view.h);}
    msg(card,'good',pick(PRAISE)+extra);card.classList.add('solved');confetti(card);
    const ex=card.querySelector('.pexp');if(!ex.hidden&&ex.dataset.diag==='1')openExplain(card,true);
  }else{
    const n=ok.filter(x=>!x).length,tot=ok.length;
    msg(card,'bad',(tot>1&&n<tot?`Næstum því! ${n} af ${tot} ${n===1?'reit er':'reitum eru'} ekki rétt${n===1?'ur':'ir'}. `:'Ekki alveg rétt. ')+'Prófaðu aftur eða ýttu á <b>Útskýring</b>.');
    const hb=card.querySelector('.b-help');hb.classList.remove('nudge');void hb.offsetWidth;hb.classList.add('nudge');
    const ex=card.querySelector('.pexp');if(!ex.hidden)openExplain(card,true);
  }
}
function openExplain(card,force){
  const p=probOf(card);if(!p)return;const ex=card.querySelector('.pexp');
  if(!ex.hidden&&!force){ex.hidden=true;return;}
  const v=getVals(card,p),ok=checkVals(p,v),wrong=p.state.tries>0&&!p.state.revealed&&v.some(x=>x!==null)&&!ok.every(Boolean);
  let E;try{E=p.explain(v,ok);}catch(e){E={diag:'',steps:[{t:'Úps, útskýringin fannst ekki.'}]};}
  const diag=wrong?(E.diag||'Svarið passar ekki alveg. Förum saman í gegnum dæmið skref fyrir skref og sjáum hvar munar.'):'';
  ex.dataset.diag=diag?'1':'0';
  ex.innerHTML=`<div class="exp-head">${OWL}<h4>${wrong?'Ugla hjálpar þér':'Svona reiknum við'}</h4></div>
    ${diag?`<div class="diag"><h5>Hvað fór úrskeiðis?</h5><p>${diag}</p></div><div class="exp-sub">Svona reiknum við:</div>`:''}
    <div class="pvis"></div><ol class="psteps">${E.steps.map(s=>`<li><div>${s.t}</div></li>`).join('')}</ol>
    <div class="pnav"><button class="btn b-prev" type="button">← Til baka</button><button class="btn b-next" type="button">Næsta skref →</button><button class="btn b-all" type="button">Sýna öll skref</button><span class="cnt"></span></div>`;
  ex._steps=E.steps;ex._cur=0;ex.hidden=false;showStep(ex);
}
function showStep(ex){
  const st=ex._steps,c=ex._cur,lis=ex.querySelectorAll('.psteps li');
  lis.forEach((li,j)=>{li.hidden=j>c;li.classList.toggle('cur',j===c);li.classList.toggle('past',j<c);});
  let vis='';for(let j=Math.min(c,st.length-1);j>=0;j--){if(st[j].v){vis=st[j].v;break;}}
  ex.querySelector('.pvis').innerHTML=vis;
  ex.querySelector('.b-prev').disabled=c===0;ex.querySelector('.b-prev').style.visibility=c===0?'hidden':'visible';
  const nx=ex.querySelector('.b-next'),al=ex.querySelector('.b-all');const end=c>=st.length-1;nx.hidden=end;al.hidden=end;
  ex.querySelector('.cnt').textContent=`Skref ${c+1} af ${st.length}`;
}
function doShow(card){
  const p=probOf(card);if(!p)return;p.state.revealed=true;clearMarks(card);
  p.fields.forEach((f,i)=>{
    if(f.type==='choice'){card.querySelectorAll(`.choices[data-i="${i}"] .choice`).forEach((b,j)=>{b.classList.toggle('sel',j===f.ans);if(j===f.ans)b.classList.add('ok');});}
    else if(f.type==='cols'){const s=String(f.ans).padStart(f.n,' ');card.querySelectorAll(`input.dig[data-i="${i}"]`).forEach(el=>{el.value=s[+el.dataset.k].trim();el.classList.add('ok');});}
    else{const el=card.querySelector(`input.ans[data-i="${i}"]`);if(el){el.value=f.disp!==undefined?f.disp:M(f.ans);el.classList.add('ok');}}});
  msg(card,'info','Hér er rétta svarið. Ýttu á <b>Útskýring</b> til að sjá hvernig það er reiknað.');
  const ex=card.querySelector('.pexp');if(!ex.hidden)openExplain(card,true);
}
function confetti(card){
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cols=['var(--blue)','var(--orange)','var(--pink)','var(--green)','var(--star)','var(--purple)'],b=card.querySelector('.b-check'),x=b.offsetLeft+b.offsetWidth/2,y=b.offsetTop;
  for(let i=0;i<18;i++){const s=document.createElement('i');s.className='conf';s.style.cssText=`--x:${x}px;--y:${y}px;--dx:${R(-140,140)}px;--dy:${R(-150,-30)}px;--r:${R(-300,300)}deg;background:${pick(cols)}`;card.appendChild(s);setTimeout(()=>s.remove(),950);}
}

app.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  const card=t.closest('.pcard');
  if(t.classList.contains('hcard')){location.hash=t.dataset.h;return;}
  if(t.id==='back'){location.hash='';renderHome();return;}
  if(t.classList.contains('tab')){view.type=t.dataset.t;document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-pressed',b===t));newSet();return;}
  if(t.id==='newset'){newSet();document.getElementById('tdesc').scrollIntoView({behavior:'smooth',block:'start'});return;}
  if(!card)return;
  if(t.classList.contains('b-check'))doCheck(card);
  else if(t.classList.contains('b-help'))openExplain(card,false);
  else if(t.classList.contains('b-show'))doShow(card);
  else if(t.classList.contains('choice')){t.parentElement.querySelectorAll('.choice').forEach(b=>b.classList.remove('sel','ok','bad'));t.classList.add('sel');}
  else if(t.classList.contains('neg')){const el=card.querySelector(`input.ans[data-i="${t.dataset.i}"]`);let s=el.value.replace(/[−–—]/g,'-').trim();el.value=s.startsWith('-')?s.slice(1):'−'+s;el.classList.remove('ok','bad');el.focus();}
  else{const ex=t.closest('.pexp');if(!ex)return;
    if(t.classList.contains('b-next'))ex._cur=Math.min(ex._steps.length-1,ex._cur+1);
    else if(t.classList.contains('b-prev'))ex._cur=Math.max(0,ex._cur-1);
    else if(t.classList.contains('b-all'))ex._cur=ex._steps.length-1;
    showStep(ex);}
});
app.addEventListener('input',e=>{
  const el=e.target;if(!el.classList.contains('ans')&&!el.classList.contains('memo'))return;
  el.classList.remove('ok','bad');
  if(el.classList.contains('dig')){el.value=el.value.replace(/[^0-9]/g,'').slice(-1);if(el.value){const prev=el.closest('.pcard').querySelector(`input.dig[data-i="${el.dataset.i}"][data-k="${+el.dataset.k-1}"]`);if(prev)prev.focus();}}
});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('input')){const c=e.target.closest('.pcard');if(c){e.preventDefault();doCheck(c);}}});
document.getElementById('logo').addEventListener('click',()=>{location.hash='';renderHome();});
function route(){const id=location.hash.replace('#','');if(id&&HL[id]){if(!view.h||view.h.id!==id){renderHluti(id);window.scrollTo(0,0);}}else if(view.h||!app.innerHTML)renderHome();}
window.addEventListener('hashchange',route);
updStars();route();
</script>
